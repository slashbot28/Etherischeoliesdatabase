<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="256" cy="270" r="130" fill="none" stroke="#34d399" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Botanical Plant Sprigs Behind Drop -->
  <!-- Left Leaf -->
  <path d="M220 340 C170 330 140 260 160 210 C180 240 200 280 220 340 Z" fill="url(#leaf)" opacity="0.9"/>
  <!-- Right Leaf -->
  <path d="M292 340 C342 330 372 260 352 210 C332 240 312 280 292 340 Z" fill="url(#leaf)" opacity="0.9"/>
  
  <!-- Central Glowing Essential Oil Droplet -->
  <path d="M256 120 C256 120 180 240 180 300 C180 342 214 376 256 376 C298 376 332 342 332 300 C332 240 256 120 256 120 Z" fill="url(#drop)"/>
  
  <!-- Inner Highlight on Droplet -->
  <ellipse cx="236" cy="280" rx="18" ry="32" transform="rotate(-25 236 280)" fill="#fff" opacity="0.45"/>
  <circle cx="275" cy="330" r="6" fill="#fff" opacity="0.3"/>
  
  <!-- Tiny Sparkles / Stars -->
  <polygon points="256,70 261,85 276,90 261,95 256,110 251,95 236,90 251,85" fill="#fef3c7"/>
  <polygon points="150,170 153,179 162,182 153,185 150,194 147,185 138,182 147,179" fill="#fef3c7" opacity="0.8"/>
  <polygon points="362,170 365,179 374,182 365,185 362,194 359,185 350,182 359,179" fill="#fef3c7" opacity="0.8"/>

  <!-- Elegant App Name text banner -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" letter-spacing="4" fill="#f1f5f9">AROMATHERAPIE</text>
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" letter-spacing="6" fill="#fbbf24">STUDIO &amp; DATABASE</text>
</svg>
